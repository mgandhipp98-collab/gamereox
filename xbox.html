<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameReox | Games</title>

    <meta
        name="description"
        content="Discover games on GameReox."
    >

    <link
        rel="stylesheet"
        href="./main.css"
    >

    <link
        rel="stylesheet"
        href="./games.css"
    >

</head>


<body data-platform="Xbox">

<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

    <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Open menu"
    >
        ☰
    </button>


    <a
        href="index.html"
        class="logo"
    >
        <span class="logo-game">GAME</span><span class="logo-reox">REOX</span>
    </a>


    <button
        class="search-btn"
        id="searchBtn"
        aria-label="Search"
    >
        <span class="search-icon"></span>
    </button>

</header>


<!-- ==================================================
     OVERLAY
================================================== -->

<div
    class="overlay"
    id="overlay"
></div>


<!-- ==================================================
     SIDEBAR
================================================== -->

<aside
    class="sidebar"
    id="sidebar"
>

    <div class="sidebar-top">

        <h2>

            <span class="logo-game">
                GAME
            </span><span class="logo-reox">
                REOX
            </span>

        </h2>


        <button
            class="close-btn"
            id="closeBtn"
            aria-label="Close menu"
        >
            ✕
        </button>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="gamingupdates.html">
            Gaming Updates
        </a>


        <h3>
            Categories
        </h3>

        <a href="xbox.html">
            Xbox
        </a>

        <a href="playstation.html">
            PlayStation
        </a>

        <a href="pc.html">
            PC
        </a>

        <a href="mobile.html">
            Mobile Games
        </a>


        <h3>
            More
        </h3>

        <a href="#">
            Upcoming
        </a>

        <a href="#">
            About
        </a>

    </nav>

</aside>


<!-- ==================================================
     SEARCH
================================================== -->

<div
    class="search-overlay"
    id="searchOverlay"
>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search games or news..."
            autocomplete="off"
        >

        <button
            id="closeSearch"
            aria-label="Close search"
        >
            ✕
        </button>

    </div>


    <div id="searchResults"></div>

</div>


<!-- ==================================================
     MAIN
================================================== -->

<main>


    <!-- ==================================================
         HERO
    ================================================== -->

    <section class="games-hero">

        <span class="hero-kicker">
            GAMEREOX GAMES
        </span>

        <h1>
            Discover Games
        </h1>

        <p>
            Explore games across Xbox, PlayStation, PC and mobile.
        </p>

    </section>


    <!-- ==================================================
         FILTERS
    ================================================== -->

    <div class="games-filters">

        <button
            class="filter active"
            data-filter="topRated"
        >
            Top Rated
        </button>


        <button
            class="filter"
            data-filter="new"
        >
            New
        </button>


        <button
            class="filter"
            data-filter="upcoming"
        >
            Upcoming
        </button>


        <button
            class="filter"
            data-filter="all"
        >
            All
        </button>

    </div>


    <!-- ==================================================
         GAMES
    ================================================== -->

    <section class="games-section">

        <div class="games-heading">

            <div>

                <span class="section-kicker">
                    EXPLORE
                </span>

                <h2 id="gamesTitle">
                    Games
                </h2>

            </div>

        </div>


        <div
            class="game-grid"
            id="gameGrid"
        >

            <p class="loading-games">
                Loading games...
            </p>

        </div>


        <!-- games.js creates #gamesPagination here -->

    </section>

</main>

<!-- ==================================================
     FOOTER
================================================== -->

<footer class="site-footer">

    <div class="footer-row">

        <div class="footer-logo">
            <span class="logo-game">GAME</span><span class="logo-reox">REOX</span>
        </div>

        <div class="footer-links">

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="privacy.html">
                Privacy
            </a>

        </div>

    </div>


    <div class="footer-copy"></div>

</footer>

<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script type="module" src="./main.js"></script>

<script type="module" src="./games.js"></script>

</body>
</html>
