<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameReox | PC Games</title>

    <meta
        name="description"
        content="Discover PC games on GameReox."
    >

    <link
        rel="stylesheet"
        href="./main.css"
    >

    <link
        rel="stylesheet"
        href="./games.css"
    >

</head>


<body data-platform="PC">


<!-- ==================================================
     SEARCH
================================================== -->

<div
    class="search-overlay"
    id="searchOverlay"
>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search games or news..."
            autocomplete="off"
        >

        <button
            id="closeSearch"
            aria-label="Close search"
        >
            ✕
        </button>

    </div>


    <div id="searchResults"></div>

</div>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

    <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Open menu"
        type="button"
    >
        ☰
    </button>


    <a
        href="index.html"
        class="logo"
    >
        <span class="logo-game">GAME</span><span class="logo-reox">REOX</span>
    </a>


    <button
        class="search-btn"
        id="searchBtn"
        aria-label="Search"
        type="button"
    >
        <span class="search-icon"></span>
    </button>

</header>


<!-- ==================================================
     SIDEBAR OVERLAY
================================================== -->

<div
    class="overlay"
    id="overlay"
></div>


<!-- ==================================================
     SIDEBAR
================================================== -->

<aside
    class="sidebar"
    id="sidebar"
>

    <div class="sidebar-top">

        <h2>

            <span class="logo-game">GAME</span><span class="logo-reox">REOX</span>

        </h2>


        <button
            class="close-btn"
            id="closeBtn"
            aria-label="Close menu"
            type="button"
        >
            ✕
        </button>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>


        <a href="gamingupdates.html">
            Gaming Updates
        </a>


        <h3>
            Categories
        </h3>


        <a href="xbox.html">
            Xbox
        </a>


        <a href="playstation.html">
            PlayStation
        </a>


        <a
            href="pc.html"
            class="active"
        >
            PC
        </a>


        <a href="mobile.html">
            Mobile Games
        </a>


        <h3>
            More
        </h3>


        <a href="#">
            Upcoming
        </a>


        <a href="admin/login.html">
            About
        </a>

    </nav>

</aside>


<!-- ==================================================
     MAIN
================================================== -->

<main>


    <!-- ==================================================
         HERO
    ================================================== -->

    <section class="games-hero">

        <span class="hero-kicker">
            PC GAMES
        </span>


        <h1>
            PC Games
        </h1>


        <p>
            Discover the best PC games, information and upcoming releases.
        </p>

    </section>


    <!-- ==================================================
         FILTERS
    ================================================== -->

    <div class="games-filters">

        <button
            class="filter active"
            id="topRatedFilter"
            data-filter="topRated"
            type="button"
        >
            Top Rated
        </button>


        <button
            class="filter"
            id="newFilter"
            data-filter="new"
            type="button"
        >
            New
        </button>


        <button
            class="filter"
            id="upcomingFilter"
            data-filter="upcoming"
            type="button"
        >
            Upcoming
        </button>


        <button
            class="filter"
            id="allFilter"
            data-filter="all"
            type="button"
        >
            All
        </button>

    </div>


    <!-- ==================================================
         GAMES
    ================================================== -->

    <section class="games-section">


        <div class="games-heading">

            <div>

                <span class="section-kicker">
                    PC
                </span>


                <h2 id="gamesTitle">
                    Top Rated PC Games
                </h2>

            </div>

        </div>


        <!-- ==================================================
             GAME GRID
        ================================================== -->

        <div
            class="game-grid"
            id="gameGrid"
        >

            <p class="loading-games">
                Loading PC games...
            </p>

        </div>


    </section>

</main>


<!-- ==================================================
     FOOTER
================================================== -->

<footer class="site-footer">

    <div class="footer-row">

        <div class="footer-logo">
            <span class="logo-game">GAME</span><span class="logo-reox">REOX</span>
        </div>


        <div class="footer-links">

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="privacy.html">
                Privacy
            </a>

        </div>

    </div>


    <div class="footer-copy">

    </div>

</footer>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script
    type="module"
    src="./main.js"
></script>


<script
    type="module"
    src="./games.js"
></script>


<script
    src="./script.js"
></script>


</body>

</html>
